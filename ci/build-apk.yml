name: Сборка Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей проекта
        run: npm install

      - name: Сборка веб-приложения (Vite Build)
        run: npm run build

      - name: Установка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Принятие лицензий Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Синхронизация платформы Android в Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Сборка Android APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./mastervarka.apk

      - name: Сохранение APK в артефактах GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mastervarka-debug-apk
          path: mastervarka.apk
          if-no-files-found: error

      - name: Прикрепление APK к Релизу GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "🍺 МастерВарка v1.0.0 — Официальный Релиз"
          files: mastervarka.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
