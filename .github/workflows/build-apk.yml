name: Сборка Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка и публикация Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Установка зависимостей проекта
        run: npm ci || npm install

      - name: Сборка веб-приложения (Vite Build)
        run: npm run build

      - name: Установка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: Добавление платформы Android в Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Сборка Android APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./mastervarka.apk

      - name: Выгрузка APK в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: mastervarka-apk
          path: mastervarka.apk
          if-no-files-found: error

      - name: Публикация APK в GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "МастерВарка v1.0.0 — Готовый APK для Android"
          body: |
            ### 🍺 Официальный релиз мобильного приложения МастерВарка!
            
            - **Файл установки для Android:** Скачайте `mastervarka.apk` из списка прикрепленных файлов ниже.
            - **Как установить:** Нажмите на скачанный файл `mastervarka.apk` на телефоне и подтвердите установку.
            - **Возможности:** 34 эталонных рецепта BJCP, калькулятор засыпи и хмеля, база Курского солода, ИИ-дизайн этикеток, 100% офлайн работа.
          files: mastervarka.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
