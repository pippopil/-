<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="foam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="beer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Mug body -->
  <path d="M140 180 C140 160 160 160 180 160 L332 160 C352 160 372 160 372 180 L360 410 C358 430 338 440 318 440 L194 440 C174 440 154 430 152 410 Z" fill="url(#beer)"/>
  
  <!-- Mug handle -->
  <path d="M366 220 L400 220 C430 220 446 244 446 274 L446 330 C446 360 430 384 400 384 L356 384" fill="none" stroke="#fef3c7" stroke-width="32" stroke-linecap="round"/>

  <!-- Beer highlights inside -->
  <path d="M175 190 L165 400" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M337 190 L347 400" stroke="#92400e" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

  <!-- Foam head -->
  <ellipse cx="256" cy="160" rx="126" ry="36" fill="url(#foam)"/>
  <circle cx="160" cy="140" r="38" fill="url(#foam)"/>
  <circle cx="215" cy="120" r="46" fill="url(#foam)"/>
  <circle cx="280" cy="115" r="48" fill="url(#foam)"/>
  <circle cx="340" cy="135" r="40" fill="url(#foam)"/>
  <!-- Drips of foam -->
  <path d="M170 180 C170 215 190 215 190 180" fill="url(#foam)"/>
  <path d="M290 180 C290 230 312 230 312 180" fill="url(#foam)"/>

  <!-- Hop leaf detail on the mug -->
  <path d="M256 260 C240 280 230 310 256 340 C282 310 272 280 256 260 Z" fill="#15803d" opacity="0.9"/>
  <path d="M236 295 C220 310 225 330 256 340" fill="none" stroke="#86efac" stroke-width="4"/>
  <path d="M276 295 C292 310 287 330 256 340" fill="none" stroke="#86efac" stroke-width="4"/>
</svg>
